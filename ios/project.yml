# The iPhone app's Xcode project, generated by XcodeGen (brew install xcodegen):
#   cd ios && xcodegen generate
# Recaller.xcodeproj is generated from this file; edit this, not the project.
name: Recaller
options:
  bundleIdPrefix: com.akhan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Recaller:
    type: application
    platform: iOS
    sources:
      - path: Recaller
        excludes:
          - "Resources/core"
          - "**/Tests"
          - "**/Tests/**"
      - path: Recaller/Resources/core
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhan.recaller.ios
        PRODUCT_NAME: Recaller
        INFOPLIST_FILE: Recaller/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    preBuildScripts:
      - name: Bundle Recaller core
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/.."
          node ios/core/build.js
  RecallerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Recaller/Voice/Tests
        optional: true
      - path: RecallerTests
        optional: true
    dependencies:
      - target: Recaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhan.recaller.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Recaller.app/Recaller"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Recaller:
    build:
      targets:
        Recaller: all
        RecallerTests: [test]
    test:
      targets:
        - RecallerTests
    run:
      config: Debug
